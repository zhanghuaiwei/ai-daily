name: AI Daily Digest

# 每天北京时间 07:30 自动运行（GitHub Actions 用 UTC，07:30 CST = 前一天 23:30 UTC）
# TODO(学习者): 想改时间就调 cron 表达式，注意是 UTC 时区，减 8 小时换算
on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch: {}   # 支持在 Actions 页面手动触发，调试必备

permissions:
  contents: write          # 允许把每日产物 commit 回仓库

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          # LLM 用哪家服务就在 Secrets 里配这三个（见 README 第 4 步）
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python -m src.pipeline

      - name: Commit daily output
        run: |
          git config user.name  "ai-daily-bot"
          git config user.email "actions@github.com"
          git add output/
          git commit -m "daily: $(date -u +%F)" || echo "no changes"
          git push
