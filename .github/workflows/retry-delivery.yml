name: Retry Existing WeChat Delivery

on:
  workflow_dispatch:
    inputs:
      edition_date:
        description: '重新推送的 Markdown 日期（北京时间，YYYY-MM-DD）'
        required: true
        type: string

concurrency:
  group: ai-daily-redelivery-${{ inputs.edition_date }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Retry WeChat Markdown
        env:
          EDITION_DATE: ${{ inputs.edition_date }}
          WECHAT_SENDKEY: ${{ secrets.WECHAT_SENDKEY }}
        run: |
          if [[ ! "${EDITION_DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "edition_date 必须是 YYYY-MM-DD"
            exit 1
          fi
          if [[ -z "${WECHAT_SENDKEY}" ]]; then
            echo "WECHAT_SENDKEY 未配置"
            exit 1
          fi
          python -m src.delivery --day-dir "output/${EDITION_DATE}"
